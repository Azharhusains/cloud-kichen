<div class="loader-overlay" *ngIf="isLoading()">
  <div class="loader-container">

    <!-- Cooking Pot Animation -->
    <svg viewBox="0 0 200 200" class="cooking-pot">
      <!-- Plate base -->
      <ellipse cx="100" cy="150" rx="60" ry="10" fill="#f5f5f5" />

      <!-- Pot -->
      <rect x="50" y="90" width="100" height="50" rx="10" fill="#ff6b35" />
      <rect x="60" y="70" width="80" height="20" rx="10" fill="#ffd23f" />

      <!-- Animated Spoon -->
      <g>
        <rect x="95" y="60" width="10" height="40" rx="5" fill="#555">
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="0 100 100; 20 100 100; -20 100 100; 0 100 100"
            dur="2s"
            repeatCount="indefinite"
          />
        </rect>
      </g>

      <!-- Steam -->
      <circle cx="80" cy="60" r="5" fill="white">
        <animate attributeName="cy" values="60;30" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>

      <circle cx="120" cy="60" r="5" fill="white">
        <animate attributeName="cy" values="60;30" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Food dropping into plate -->
      <circle cx="100" cy="80" r="6" fill="#ffd23f">
        <animate attributeName="cy" values="80;140" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </svg>

    <!-- Dynamic Cloud Kitchen Messages -->
    <p class="loader-message">{{ getRandomMessage() }}</p>

  </div>
</div>
