<div class="unauthorized-container">
  <mat-card class="unauthorized-card">
    <mat-card-header>
      <mat-card-title>Access Denied</mat-card-title>
      <mat-card-subtitle>You don't have permission to access this page</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="icon-container">
        <mat-icon class="lock-icon">lock</mat-icon>
      </div>
      <p>Your current role doesn't have access to this resource.</p>
      <p><strong>Contact Super Admin for access promotion.</strong></p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="goHome()">Go to Home</button>
      <button mat-button (click)="goToMenu()">Menu</button>
    </mat-card-actions>
  </mat-card>
</div>
