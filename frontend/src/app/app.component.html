<!-- Premium Network Status Indicator -->
<div class="fixed top-4 right-4 z-50 transition-all duration-300" *ngIf="showNetworkStatus">
  <div class="bg-black bg-opacity-90 text-white px-4 py-2 rounded-full shadow-lg flex items-center space-x-2">
    <div class="w-3 h-3 rounded-full" [ngClass]="networkIndicatorClass"></div>
    <span>{{ isOnline ? 'Online' : 'Offline' }} {{ connectionQuality }}</span>
  </div>
</div>
